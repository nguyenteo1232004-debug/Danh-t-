<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập Phân Biệt Từ Loại (Danh từ / Tính từ / Khác)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 650px;
            width: 100%;
            text-align: center;
        }
        .stats {
            display: flex;
            justify-content: flex-end;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #555;
        }
        .timer-bar {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .timer-progress {
            height: 100%;
            width: 100%;
            background-color: #ff9800;
            transition: width 0.1s linear;
        }
        .word-card {
            font-size: 38px;
            font-weight: bold;
            color: #333;
            margin: 30px 0;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            transition: background-color 0.2s, color 0.2s;
        }
        .word-card.correct {
            background-color: #d4edda;
            color: #155724;
        }
        .word-card.incorrect {
            background-color: #f8d7da;
            color: #721c24;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        button {
            flex: 1;
            padding: 15px 10px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-noun {
            background-color: #007bff;
            color: white;
        }
        .btn-adj {
            background-color: #28a745;
            color: white;
        }
        .btn-other {
            background-color: #6c757d;
            color: white;
        }
        .btn-start {
            background-color: #007bff;
            color: white;
            width: 100%;
        }
        .result-screen {
            display: none;
            text-align: left;
        }
        .result-screen h2 {
            text-align: center;
            color: #333;
        }
        .wrong-list-container {
            margin-top: 20px;
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #dc3545;
            border-radius: 8px;
            background-color: #fff5f5;
        }
        .wrong-list-header {
            background-color: #dc3545;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .wrong-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid #f2d6d6;
            color: #721c24;
        }
        .wrong-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h2>Luyện Tập Phân Biệt Từ Loại</h2>
        <p>Thử thách nhận diện nhanh các <b>Danh từ</b>, <b>Tính từ</b> và <b>Từ loại khác</b>.</p>
        <p>Mỗi từ xuất hiện có <b>5 giây</b> đếm ngược để chọn đáp án.</p>

        <button class="btn-start" onclick="startGame()">Bắt Đầu</button>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="stats">
            <span id="score-text">Đúng: 0</span>
        </div>
        <div class="timer-bar">
            <div id="timer-progress" class="timer-progress"></div>
        </div>
        <div id="word-card" class="word-card">Word</div>
        <div class="btn-group">
            <button class="btn-noun" onclick="submitAnswer('noun')">Danh Từ</button>
            <button class="btn-adj" onclick="submitAnswer('adj')">Tính Từ</button>
            <button class="btn-other" onclick="submitAnswer('other')">Khác</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>KẾT QUẢ</h2>
        <p style="text-align: center; font-size: 18px;" id="final-score"></p>
        
        <div id="wrong-container">
            <h3>Danh sách các từ chọn sai / bỏ trống:</h3>
            <div class="wrong-list-container">
                <div class="wrong-list-header">
                    <span>Từ</span>
                    <span>Từ loại đúng</span>
                </div>
                <div id="wrong-list"></div>
            </div>
        </div>

        <button class="btn-start" style="margin-top: 20px;" onclick="startGame()">Làm Lại</button>
    </div>
</div>

let words = [];
let currentIndex = 0;
let score = 0;
let wrongAnswers = [];
let timer = null;
let timerStartTime = 0;
const TIME_LIMIT = 5000;

function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startGame() {
    words = shuffle(rawWordBank);
    currentIndex = 0;
    score = 0;
    wrongAnswers = [];

    document.getElementById("start-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";

    showNextWord();
}

function showNextWord() {
    if (currentIndex >= words.length) {
        endGame();
        return;
    }

    const wordObj = words[currentIndex];
    const wordCard = document.getElementById("word-card");
    
    wordCard.className = "word-card";
    wordCard.innerText = wordObj.w;

    document.getElementById("score-text").innerText = `Đúng: ${score}`;

    startTimer();
}

function startTimer() {
    clearInterval(timer);
    const progressBar = document.getElementById("timer-progress");
    progressBar.style.width = "100%";
    timerStartTime = Date.now();

    timer = setInterval(() => {
        const elapsed = Date.now() - timerStartTime;
        const remainingPercent = Math.max(0, 100 - (elapsed / TIME_LIMIT) * 100);
        
        progressBar.style.width = `${remainingPercent}%`;

        if (elapsed >= TIME_LIMIT) {
            clearInterval(timer);
            handleTimeOut();
        }
    }, 50);
}

function handleTimeOut() {
    const currentWord = words[currentIndex];
    wrongAnswers.push(currentWord);
    
    flashCard(false, () => {
        currentIndex++;
        showNextWord();
    });
}

function submitAnswer(userChoice) {
    clearInterval(timer);
    const currentWord = words[currentIndex];
    const isCorrect = (userChoice === currentWord.type);

    if (isCorrect) {
        score++;
    } else {
        wrongAnswers.push(currentWord);
    }

    flashCard(isCorrect, () => {
        currentIndex++;
        showNextWord();
    });
}

function flashCard(isCorrect, callback) {
    const wordCard = document.getElementById("word-card");
    wordCard.className = `word-card ${isCorrect ? 'correct' : 'incorrect'}`;
    
    setTimeout(() => {
        callback();
    }, 300);
}

function endGame() {
    document.getElementById("game-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";

    document.getElementById("final-score").innerText = `Kết quả của bạn: ${score} / ${words.length} từ đúng`;

    const wrongListEl = document.getElementById("wrong-list");
    wrongListEl.innerHTML = "";

    if (wrongAnswers.length === 0) {
        document.getElementById("wrong-container").style.display = "none";
    } else {
        document.getElementById("wrong-container").style.display = "block";
        wrongAnswers.forEach(item => {
            const row = document.createElement("div");
            row.className = "wrong-item";
            row.innerHTML = `<span><b>${item.w}</b></span><span>${item.desc || item.label}</span>`;
            wrongListEl.appendChild(row);
        });
    }
}
